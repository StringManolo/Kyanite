[package]
name = "kpkg"
version = "0.1.0"
edition = "2021"

[dependencies]
ureq = "2.9"
xz2 = "0.1"
flate2 = "1.0"
tar = "0.4"
ar = "0.3"
sha2 = "0.10"
hex = "0.4"
pgp = { version = "0.15", default-features = false }
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }

# Optimizaciones de tamaño y rendimiento para binarios estáticos (musl)
[profile.release]
opt-level = "s"      # Optimizar para tamaño reducido del binario
lto = true           # Link Time Optimization para reducir tamaño y mejorar rendimiento
codegen-units = 1    # Necesario para habilitar LTO de forma efectiva
panic = "abort"      # Elimina el código de unwinding, reduciendo drásticamente los MB del binario
strip = true         # Elimina símbolos de depuración automáticamente en release
