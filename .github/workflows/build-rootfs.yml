name: Build Kyanite Rootfs

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Kyanite for ${{ matrix.arch }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - arch: aarch64
            rust_target: aarch64-unknown-linux-musl
            debian_arch: arm64
          - arch: x86_64
            rust_target: x86_64-unknown-linux-musl
            debian_arch: amd64

    steps:
      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history + tags, needed by "git describe" below.
          fetch-depth: 0

      # ============================================================
      # 1b. VERSION
      # ============================================================

      - name: Compute Kyanite version
        run: |
          # On a tag:           v0.1.0
          # N commits after it: v0.1.0-3-g1a2b3c4
          # No tag yet:         1a2b3c4 (commit hash)
          echo "KYANITE_VERSION=$(git describe --tags --always)" >> "$GITHUB_ENV"

      # ============================================================
      # 2. RUST TOOLCHAIN
      # ============================================================

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      # ============================================================
      # 3. BUILD DEPENDENCIES
      # ============================================================

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xz-utils \
            musl-tools \
            build-essential \
            gcc-aarch64-linux-gnu \
            curl \
            binutils

      # ============================================================
      # 4. COMPILE KYANITE INIT (PID 1)
      # ============================================================

      - name: Compile Kyanite Init (PID 1)
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: aarch64-linux-gnu-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_RUSTFLAGS: "-C relocation-model=static -C link-arg=-no-pie"
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_RUSTFLAGS: "-C relocation-model=static -C link-arg=-no-pie"
        run: |
          cd init
          cargo build --release --target ${{ matrix.rust_target }}
          cd ..

      # ============================================================
      # 5. COMPILE KPKG
      # ============================================================

      - name: Compile kpkg (Secure Package Manager)
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: aarch64-linux-gnu-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_RUSTFLAGS: "-C relocation-model=static -C link-arg=-no-pie"
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_RUSTFLAGS: "-C relocation-model=static -C link-arg=-no-pie"
        run: |
          cd kpkg
          cargo build --release --target ${{ matrix.rust_target }}
          cd ..

      # ============================================================
      # 6. BUILD BRUSH SHELL
      # ============================================================

      - name: Build and Install Brush Shell
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: aarch64-linux-gnu-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_RUSTFLAGS: "-C relocation-model=static -C link-arg=-no-pie"
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_RUSTFLAGS: "-C relocation-model=static -C link-arg=-no-pie"
        run: |
          cargo install brush-shell \
            --target ${{ matrix.rust_target }} \
            --root ./brush-install

      # ============================================================
      # 6b. BUILD UUTILS COREUTILS (ls, cat, cp, mv, rm, ... en Rust)
      # ============================================================

      - name: Build uutils coreutils (Rust)
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: aarch64-linux-gnu-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_RUSTFLAGS: "-C relocation-model=static -C link-arg=-no-pie"
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_RUSTFLAGS: "-C relocation-model=static -C link-arg=-no-pie"
          CARGO_PROFILE_RELEASE_STRIP: "true"
        run: |
          # Un solo binario multicall. Para fijar version: --version X.Y.Z
          cargo install coreutils \
            --locked \
            --features feat_os_unix_musl \
            --target ${{ matrix.rust_target }} \
            --root ./coreutils-install

      # ============================================================
      # 7. ASSEMBLE ROOTFS
      # ============================================================

      - name: Assemble Kyanite Rootfs Structure
        run: |
          set -euo pipefail

          ARCH_DIR="rootfs-${{ matrix.arch }}"
          DEBIAN_ARCH="${{ matrix.debian_arch }}"


          mkdir -p \
            "$ARCH_DIR/bin" \
            "$ARCH_DIR/sbin" \
            "$ARCH_DIR/lib" \
            "$ARCH_DIR/lib64" \
            "$ARCH_DIR/usr/bin" \
            "$ARCH_DIR/usr/lib" \
            "$ARCH_DIR/etc" \
            "$ARCH_DIR/proc" \
            "$ARCH_DIR/sys" \
            "$ARCH_DIR/dev" \
            "$ARCH_DIR/tmp" \
            "$ARCH_DIR/root"

          # --------------------------------------------------------
          # 7.1 Rust binaries
          # --------------------------------------------------------

          echo "Installing Kyanite binaries..."

          install -m 0755 \
            "init/target/${{ matrix.rust_target }}/release/kyanite-init" \
            "$ARCH_DIR/sbin/init"

          install -m 0755 \
            "kpkg/target/${{ matrix.rust_target }}/release/kpkg" \
            "$ARCH_DIR/usr/bin/kpkg"

          install -m 0755 \
            "./brush-install/bin/brush" \
            "$ARCH_DIR/bin/brush"

          # uutils coreutils (Rust): ls, cat, cp, mv, rm, ... como applets de un binario multicall
          install -m 0755 "./coreutils-install/bin/coreutils" "$ARCH_DIR/usr/bin/coreutils"
          UUTILS_APPLETS="arch b2sum base32 base64 basename basenc cat chgrp chmod chown cksum comm cp csplit cut date dd df dir dircolors dirname du echo expand expr factor false fmt fold groups head hostname id install join kill link ln logname ls md5sum mkdir mkfifo mknod mktemp mv nice nl nohup nproc numfmt od paste pathchk pr printenv printf ptx pwd readlink realpath rm rmdir seq sha1sum sha224sum sha256sum sha384sum sha512sum shred shuf sleep sort split stat stty sum sync tac tail tee test timeout touch tr true truncate tsort tty uname unexpand uniq unlink vdir wc whoami yes"
          for applet in $UUTILS_APPLETS; do
            ln -sfn coreutils "$ARCH_DIR/usr/bin/$applet"
          done

          # --------------------------------------------------------
          # 7.2 Shell entry point
          # --------------------------------------------------------

          echo "Configuring Kyanite startup..."

          # The generic ProotLauncher selects /bin/sh because
          # Kyanite does not contain Bash.
          #
          # /bin/sh -> /sbin/init
          #
          # This makes kyanite-init the initial process.

          ln -sfn /sbin/init "$ARCH_DIR/bin/sh"

          # --------------------------------------------------------
          # 7.3 Architecture configuration
          # --------------------------------------------------------

          case "$DEBIAN_ARCH" in
            amd64)
              LIB_PREFIX="x86_64-linux-gnu"
              LOADER_NAME="ld-linux-x86-64.so.2"
              ;;
            arm64)
              LIB_PREFIX="aarch64-linux-gnu"
              LOADER_NAME="ld-linux-aarch64.so.1"
              ;;
            *)
              echo "ERROR: Unsupported architecture: $DEBIAN_ARCH"
              exit 1
              ;;
          esac

          # --------------------------------------------------------
          # 7.4 Download glibc runtime + vi (vim-tiny)
          # --------------------------------------------------------

          echo "Downloading glibc runtime and vi ($DEBIAN_ARCH)..."

          if [ "$DEBIAN_ARCH" = "arm64" ]; then
            sudo dpkg --add-architecture arm64
            sudo apt-get update -qq
          fi

          mkdir deb_extract
          cd deb_extract

          if [ "$DEBIAN_ARCH" = "amd64" ]; then
            apt-get download libc6 libgcc-s1
            apt-get download \
              vim-tiny vim-common \
              libacl1 libselinux1 libpcre2-8-0 libtinfo6 \
              ncurses-base
          else
            apt-get download \
              libc6:arm64 \
              libgcc-s1:arm64 \
              gnu-coreutils:arm64
            apt-get download \
              vim-tiny:arm64 \
              libacl1:arm64 libselinux1:arm64 libpcre2-8-0:arm64 libtinfo6:arm64
            # Architecture-independent packages: try the :arm64 form first,
            # fall back to the plain name.
            for pkg in vim-common ncurses-base; do
              apt-get download "$pkg:arm64" || apt-get download "$pkg"
            done
          fi

          # --------------------------------------------------------
          # 7.5 Extract Debian packages
          # --------------------------------------------------------

          for deb in *.deb; do
            echo "  $deb -> arch: $(dpkg-deb -f "$deb" Architecture)"
            dpkg-deb -x "$deb" .
          done

          # --------------------------------------------------------
          # 7.6 Install multiarch libraries
          # --------------------------------------------------------

          echo "Installing multiarch libraries..."

          if [ -d "lib/$LIB_PREFIX" ]; then
            cp -a "lib/$LIB_PREFIX/." "../$ARCH_DIR/lib/"
          fi

          if [ -d "usr/lib/$LIB_PREFIX" ]; then
            cp -a "usr/lib/$LIB_PREFIX/." "../$ARCH_DIR/usr/lib/"
          fi

          # --------------------------------------------------------
          # 7.6b Install vi (vim-tiny) and the terminfo database
          # --------------------------------------------------------

          echo "Installing vi (vim-tiny)..."

          if [ ! -f usr/bin/vim.tiny ]; then
            echo "ERROR: usr/bin/vim.tiny not found in vim-tiny"
            exit 1
          fi

          install -D -m 0755 usr/bin/vim.tiny "../$ARCH_DIR/usr/bin/vim.tiny"

          # Debian creates these through update-alternatives (a maintainer
          # script, which is never run here), so link them by hand.
          for name in vi vim ex view; do
            ln -sfn vim.tiny "../$ARCH_DIR/usr/bin/$name"
          done

          # Vim config/runtime files and the terminfo database (vim does not
          # start without a terminfo entry for $TERM).
          for dir in etc/vim usr/share/vim lib/terminfo usr/share/terminfo etc/terminfo; do
            if [ -d "$dir" ]; then
              mkdir -p "../$ARCH_DIR/$(dirname "$dir")"
              cp -a "$dir" "../$ARCH_DIR/$(dirname "$dir")/"
            fi
          done

          if [ ! -d "../$ARCH_DIR/lib/terminfo" ] && [ ! -d "../$ARCH_DIR/usr/share/terminfo" ]; then
            echo "ERROR: terminfo database not found (ncurses-base)"
            exit 1
          fi

         # --------------------------------------------------------
         # 7.6c Remove unnecessary Vim documentation
         # --------------------------------------------------------

         echo "Removing unnecessary Vim documentation..."

         find "$ARCH_DIR/usr/share/vim" -type f \( \
           -name "version9.txt" -o \
           -name "uganda.txt" \
         \) -delete

          # --------------------------------------------------------
          # 7.7 Install the actual dynamic linker
          # --------------------------------------------------------

          echo "Locating dynamic linker: $LOADER_NAME"

          # Do not copy a potentially broken absolute symlink.
          # Locate the actual loader binary inside the extracted
          # Debian packages and install it directly into /lib.

          LOADER_SOURCE="$(
            find . -type f -name "$LOADER_NAME" -print -quit
          )"

          if [ -z "$LOADER_SOURCE" ]; then
            echo "ERROR: Dynamic linker not found: $LOADER_NAME"
            echo "Available loader candidates:"
            find . -name 'ld-linux*' -ls || true
            exit 1
          fi

          echo "Found loader: $LOADER_SOURCE"

          install -D -m 0755 \
            "$LOADER_SOURCE" \
            "../$ARCH_DIR/lib/$LOADER_NAME"

          # --------------------------------------------------------
          # 7.8 AMD64 ELF interpreter compatibility
          # --------------------------------------------------------

          if [ "$DEBIAN_ARCH" = "amd64" ]; then

            # x86_64 ELF binaries normally request:
            # /lib64/ld-linux-x86-64.so.2

            ln -sfn \
              "../lib/$LOADER_NAME" \
              "../$ARCH_DIR/lib64/$LOADER_NAME"

          fi

          # --------------------------------------------------------
          # 7.9 Install env
          # --------------------------------------------------------

          echo "Installing env..."

          if [ "$DEBIAN_ARCH" = "arm64" ]; then

            if [ -f usr/bin/env ]; then
              cp -L usr/bin/env "../$ARCH_DIR/usr/bin/env"

            elif [ -f usr/bin/gnuenv ]; then
              cp -L usr/bin/gnuenv "../$ARCH_DIR/usr/bin/env"

            else
              echo "ERROR: env/gnuenv not found in gnu-coreutils:arm64"
              ls -la usr/bin/ | head -50
              exit 1
            fi

          fi

          cd ..
          rm -rf deb_extract

          # AMD64 env comes from the native Ubuntu runner.

          if [ "$DEBIAN_ARCH" = "amd64" ]; then
            install -m 0755 /usr/bin/env "$ARCH_DIR/usr/bin/env"
          fi

          # --------------------------------------------------------
          # 7.10 Verify dynamic linker
          # --------------------------------------------------------

          echo "Verifying dynamic linker..."

          test -f "$ARCH_DIR/lib/$LOADER_NAME"

          if [ "$DEBIAN_ARCH" = "amd64" ]; then
            test -L "$ARCH_DIR/lib64/$LOADER_NAME"
            test -e "$ARCH_DIR/lib64/$LOADER_NAME"
          fi

          # --------------------------------------------------------
          # 7.11 Base system configuration
          # --------------------------------------------------------

          echo "kyanite" > "$ARCH_DIR/etc/hostname"

          echo "nameserver 1.1.1.1" > "$ARCH_DIR/etc/resolv.conf"

          echo "root:x:0:0:root:/root:/bin/brush" \
            > "$ARCH_DIR/etc/passwd"

          echo "root:x:0:" > "$ARCH_DIR/etc/group"

          chmod 1777 "$ARCH_DIR/tmp"

          # Paquetes que kpkg debe dar por instalados (ya vienen en este rootfs)
          mkdir -p "$ARCH_DIR/etc/kpkg"
          printf '%s\n' \
            libc6 libgcc-s1 coreutils \
            vim-tiny vim-common libacl1 libselinux1 libpcre2-8-0 libtinfo6 ncurses-base \
            > "$ARCH_DIR/etc/kpkg/assume-installed"

          # --------------------------------------------------------
          # 7.11b Overlay: /etc/profile, MOTD, ~/.bashrc, ...
          # --------------------------------------------------------

          echo "Applying rootfs-overlay..."

          cp -a rootfs-overlay/. "$ARCH_DIR/"

          # Git does not guarantee modes on every checkout: enforce them.
          find "$ARCH_DIR/etc/update-motd.d" -type f -exec chmod 0755 {} +
          find "$ARCH_DIR/etc/kyanite" -type f -exec chmod 0644 {} +
          chmod 0644 "$ARCH_DIR/etc/profile" "$ARCH_DIR/root/.bashrc"

          # /etc/os-release: identifies the build (used by the MOTD)
          {
            echo 'NAME="Kyanite"'
            echo 'ID=kyanite'
            echo "VERSION=\"$KYANITE_VERSION\""
            echo "VERSION_ID=\"${KYANITE_VERSION#v}\""
            echo "PRETTY_NAME=\"Kyanite $KYANITE_VERSION\""
            echo "BUILD_ID=\"${GITHUB_SHA::7}\""
            echo 'HOME_URL="https://github.com/StringManolo/Kyanite"'
            echo 'BUG_REPORT_URL="https://github.com/StringManolo/Kyanite/issues"'
          } > "$ARCH_DIR/etc/os-release"

          # --------------------------------------------------------
          # 7.12 Final rootfs checks
          # --------------------------------------------------------

          echo ""
          echo "========== ROOTFS VERIFICATION =========="

          ls -l "$ARCH_DIR/sbin/init"
          ls -l "$ARCH_DIR/bin/brush"
          ls -l "$ARCH_DIR/bin/sh"
          ls -l "$ARCH_DIR/usr/bin/env"
          ls -l "$ARCH_DIR/usr/bin/vi"
          ls -l "$ARCH_DIR/lib/$LOADER_NAME"
          ls -l "$ARCH_DIR/etc/profile" "$ARCH_DIR/root/.bashrc" "$ARCH_DIR/etc/os-release"
          ls -l "$ARCH_DIR/etc/update-motd.d/"

          if [ "$DEBIAN_ARCH" = "amd64" ]; then
            ls -l "$ARCH_DIR/lib64/$LOADER_NAME"
          fi

          echo ""
          echo "Kyanite $KYANITE_VERSION rootfs assembled successfully."

      # ============================================================
      # 8. COMPRESS ROOTFS AND GENERATE SHA256
      # ============================================================

      - name: Compress Rootfs to Tar.Xz & Generate Hash
        run: |
          set -euo pipefail

          ARCHIVE_NAME="kyanite-rootfs-${{ matrix.arch }}.tar.xz"
          HASH_NAME="${ARCHIVE_NAME}.sha256"

          tar --numeric-owner \
            -cf - \
            -C "rootfs-${{ matrix.arch }}" . \
            | xz -9 -T0 > "$ARCHIVE_NAME"

          sha256sum "$ARCHIVE_NAME" > "$HASH_NAME"

          ls -lh "$ARCHIVE_NAME" "$HASH_NAME"

      # ============================================================
      # 9. UPLOAD ROOTFS ARTIFACT
      # ============================================================

      - name: Upload Clean Rootfs Artifact
        uses: actions/upload-artifact@v7
        with:
          name: kyanite-rootfs-${{ matrix.arch }}
          path: kyanite-rootfs-${{ matrix.arch }}.tar.xz
          archive: false

      # ============================================================
      # 10. UPLOAD SHA256
      # ============================================================

      - name: Upload SHA256 Checksum Artifact
        uses: actions/upload-artifact@v7
        with:
          name: kyanite-rootfs-${{ matrix.arch }}-sha256
          path: kyanite-rootfs-${{ matrix.arch }}.tar.xz.sha256
          archive: false

      # ============================================================
      # 11. GITHUB RELEASE
      # ============================================================

      - name: Release to GitHub
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            kyanite-rootfs-${{ matrix.arch }}.tar.xz
            kyanite-rootfs-${{ matrix.arch }}.tar.xz.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
